<!DOCTYPE html>
<html>
<head>
<title>Seriously Unserious</title>
<link href="https://fonts.googleapis.com/css2?family=Ribeye&family=Yuji+Mai&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    background-image: url("https://cdn.discordapp.com/attachments/1207660497269170286/1551118272186032238/Untitled_design_7.png?ex=6ab0cef6&is=6aaf7d76&hm=0721cd03d4ae72830cbc448ed6799749a86c865554d1c55caa6c97cb060cc008&");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    margin: 0;
    padding: 20px;
    font-family: 'Ribeye', cursive;
}

#photo {
    width: 850px;
    max-width: 95%;
    margin: 30px auto;
    padding: 25px;
    background-color: #ffd1df;
    border: 10px solid #ff9fbc;
    border-right: 10px solid orange;
    border-bottom: 10px solid orange;
    text-align: center;
}

#photo h1 {
    font-family: 'Yuji Mai', cursive;
    font-size: 55px;
    margin-top: 0;
}

#photo img {
    width: 100%;
    height: auto;
    display: block;
    margin: auto;
}

#description {
    width: 850px;
    max-width: 95%;
    margin: 30px auto;
    text-align: center;
}

#description img {
    width: 100%;
    height: auto;
    display: block;
    margin: auto;
}

#portfolios {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: stretch;
    gap: 40px;
    margin: 70px auto;
    max-width: 1000px;
}

#sofia,
#tyra {
    width: 440px;
    height: 480px;
    padding: 25px;
    background-color: #ffd1df;
    border: 10px solid #ff9fbc;
    border-right: 10px solid orange;
    border-bottom: 10px solid orange;
    text-align: center;
    display: flex;
    flex-direction: column;
}

#sofia h2,
#tyra h2 {
    font-family: 'Yuji Mai', cursive;
    font-size: 38px;
    margin: 0 0 25px 0;
    height: 95px;
    display: flex;
    justify-content: center;
    align-items: center;
}

#sofia-work,
#tyra-work {
    display: flex;
    justify-content: center;
    gap: 15px;
}

#sofia-work div,
#tyra-work div {
    width: 170px;
    height: 170px;
    background-color: white;
    border: 5px solid #ffb6c9;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

#sofia-work img,
#tyra-work img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

#sofia > p,
#tyra > p {
    font-size: 20px;
    margin-top: 25px;
    margin-bottom: 0;
}

#rating {
    width: 850px;
    max-width: 95%;
    margin: 50px auto;
    padding: 25px;
    background-color: #fff0f5;
    border: 5px solid pink;
    border-radius: 20px;
    text-align: center;
}

#rating h2 {
    font-family: 'Yuji Mai', cursive;
    font-size: 40px;
    margin-top: 0;
}

#ratings {
    display: flex;
    justify-content: center;
    gap: 80px;
}

#ghai-rating,
#tyra-rating {
    width: 300px;
}

#ghai-rating h3,
#tyra-rating h3 {
    font-family: 'Yuji Mai', cursive;
    font-size: 30px;
    margin-bottom: 10px;
}

.stars {
    display: flex;
    justify-content: center;
    gap: 5px;
}

.stars button {
    font-family: serif;
    font-size: 45px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0;
    color: #d8d8d8;
    transition: 0.2s;
}

.stars button:hover {
    transform: scale(1.2);
}

.stars button.selected {
    color: #ffd43b;
}

#rating p {
    font-size: 22px;
}

#feedback {
    width: 650px;
    max-width: 95%;
    margin: 50px auto;
    padding: 25px;
    background-color: #ffd1df;
    border: 5px solid #ff9fbc;
    border-radius: 20px;
    text-align: center;
}

#feedback h2 {
    font-family: 'Yuji Mai', cursive;
    font-size: 38px;
    margin-top: 0;
}

#feedback textarea {
    width: 90%;
    height: 120px;
    padding: 10px;
    font-family: 'Ribeye', cursive;
    font-size: 20px;
    border: 3px solid pink;
    border-radius: 10px;
    resize: none;
}

#feedback button {
    margin-top: 15px;
    padding: 10px 30px;
    font-family: 'Ribeye', cursive;
    font-size: 22px;
    font-weight: 600;
    background-color: pink;
    border: 3px solid #ff9fbc;
    border-radius: 10px;
    cursor: pointer;
}

@media (max-width: 900px) {
    #portfolios {
        flex-direction: column;
        align-items: center;
    }

    #sofia,
    #tyra {
        width: 90%;
    }

    #ratings {
        flex-direction: column;
        align-items: center;
        gap: 30px;
    }
}
</style>
</head>

<body>

<div id="photo">
    <h1>Seriously Unserious</h1>
    <img src="https://cdn.discordapp.com/attachments/1207660497269170286/1551138423878975508/exasc-removebg-preview.png?ex=6ab0e1bb&is=6aaf903b&hm=13ed25edbe13e29144a42f012de8cef24587a424f094b0e62e3094ab5a8ac477&" alt="Ghaissani and Tyra">
</div>

<div id="description">
    <img src="https://cdn.discordapp.com/attachments/1207660497269170286/1551133779257729164/wswswsw-removebg-preview.png?ex=6ab0dd67&is=6aaf8be7&hm=71757af2439473616fe7d9e7f6f32be2aff26c56efd96c0c5f9f24b6bd6a2f85&" alt="Our Portfolio: Seriously Unserious">
</div>

<section id="portfolios">

    <div id="sofia">
        <h2>Ghaissani's Portfolio</h2>

        <div id="sofia-work">
            <div>
                <img src="https://storage.googleapis.com/oa_disk001/oblaspinas/69/classfeed/3651/submissions/1788937159-1219.png" alt="Ghaissani's Work 1">
            </div>

            <div>
                <img src="https://storage.googleapis.com/oa_disk001/oblaspinas/69/classfeed/3651/submissions/1788318694-183.png" alt="Ghaissani's Work 2">
            </div>
        </div>

        <p>Here are some of my projects and creative works!</p>
    </div>

    <div id="tyra">
        <h2>Tyra's Portfolio</h2>

        <div id="tyra-work">
            <div>
                <img src="https://cdn.discordapp.com/attachments/1207660497269170286/1551139718253650021/1788922888-162.png?ex=6ab0e2ef&is=6aaf916f&hm=ad987368626c88533270c5868d93b7f1bdcc1a650e957e13777ec49e9e8a92cb&" alt="Tyra's Work 1">
            </div>

            <div>
                <img src="https://cdn.discordapp.com/attachments/1207660497269170286/1551139403311878164/1788318749-2220.png?ex=6ab0e2a4&is=6aaf9124&hm=94b14ba5ffc15ee7bdbc58c3791bf1972343f99a8c9e90df4989c28eb1c97217&" alt="Tyra's Work 2">
            </div>
        </div>

        <p>Here are some of my projects and creative works!</p>
    </div>

</section>

<div id="rating">

    <h2>Rate Our Portfolio!</h2>

    <div id="ratings">

        <div id="ghai-rating">
            <h3>Ghaissani</h3>

            <div class="stars">
                <button onclick="rate(this)">☆</button>
                <button onclick="rate(this)">☆</button>
                <button onclick="rate(this)">☆</button>
                <button onclick="rate(this)">☆</button>
                <button onclick="rate(this)">☆</button>
            </div>
        </div>

        <div id="tyra-rating">
            <h3>Tyra</h3>

            <div class="stars">
                <button onclick="rate(this)">☆</button>
                <button onclick="rate(this)">☆</button>
                <button onclick="rate(this)">☆</button>
                <button onclick="rate(this)">☆</button>
                <button onclick="rate(this)">☆</button>
            </div>
        </div>

    </div>

    <p>How seriously unserious are we?</p>

</div>

<div id="feedback">

    <h2>Leave Us Some Feedback!</h2>

    <textarea placeholder="Write something nice... or unserious!"></textarea>

    <br>

    <button>Submit</button>

</div>

<script>
function rate(star) {
    let stars = star.parentElement.children;
    let clicked = Array.from(stars).indexOf(star);

    for (let i = 0; i < stars.length; i++) {
        if (i <= clicked) {
            stars[i].classList.add("selected");
            stars[i].innerHTML = "★";
        } else {
            stars[i].classList.remove("selected");
            stars[i].innerHTML = "☆";
        }
    }
}
</script>

</body>
</html>
